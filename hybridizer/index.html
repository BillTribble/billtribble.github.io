<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ead6" />
  <title>Hybridizer — Botanical Hybridization Study</title>
  <style>
    :root {
      --paper: #f3ead6;
      --ink: #000000;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Full-screen WebGL2 paper grain backdrop (SH.background) */
    #paper-backdrop {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    /* Top botanical study header (understated serif in Jack Bush's style) */
    #study-header {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      z-index: 4;
      pointer-events: none;
      display: flex;
      align-items: baseline;
      gap: 10px;
      font: italic 300 15px/1.2 var(--serif);
      letter-spacing: 0.02em;
      color: var(--ink);
      opacity: 0.72;
    }

    #cycle-gen {
      font-style: normal;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 11.5px;
      opacity: 0.85;
    }

    #cycle-sep {
      opacity: 0.45;
    }

    #cycle-timer {
      font-variant-numeric: tabular-nums;
      opacity: 0.65;
      margin-left: 2px;
    }

    /* Top-right minimal disc buttons matching Jack Bush's SketchLayout.astro */
    .disc {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      z-index: 5;
      width: 36px;
      height: 36px;
      padding: 8px;
      display: block;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.08);
      color: #1a1612;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.2s, background 0.2s, transform 0.2s;
    }

    .disc:hover, .disc:focus-visible {
      opacity: 0.9;
      background: rgba(0, 0, 0, 0.15);
    }

    .disc svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #next-btn {
      right: max(16px, env(safe-area-inset-right));
    }

    #play-btn {
      right: calc(max(16px, env(safe-area-inset-right)) + 44px);
    }

    #info-btn, #btn-info {
      right: calc(max(16px, env(safe-area-inset-right)) + 88px);
    }

    #settings-btn, #btn-settings {
      right: calc(max(16px, env(safe-area-inset-right)) + 132px);
    }

    #info-btn[aria-expanded="true"], #btn-info[aria-expanded="true"],
    #settings-btn[aria-expanded="true"], #btn-settings[aria-expanded="true"] {
      opacity: 0.92;
      background: rgba(0, 0, 0, 0.16);
    }

    #info-panel, #settings-panel {
      position: fixed;
      top: calc(max(14px, env(safe-area-inset-top)) + 44px);
      right: max(16px, env(safe-area-inset-right));
      z-index: 6;
      width: min(320px, calc(100vw - 32px));
      padding: 16px 18px;
      border-radius: 12px;
      background: rgba(243, 234, 214, 0.96);
      box-shadow: 0 8px 28px rgba(26, 22, 18, 0.12);
      border: 1px solid rgba(26, 22, 18, 0.12);
      color: var(--ink);
      font: normal 400 13.5px/1.5 var(--serif);
      backdrop-filter: blur(8px);
    }

    #info-panel[hidden], #settings-panel[hidden] {
      display: none !important;
    }

    #info-panel h2, #settings-panel h2 {
      font: italic 400 16px/1.25 var(--serif);
      margin: 0 0 6px 0;
    }

    #info-panel p, #settings-panel p {
      margin: 0 0 10px 0;
      opacity: 0.82;
    }

    #info-panel p:last-child, #settings-panel p:last-child {
      margin-bottom: 0;
    }

    .biome-toggle-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .biome-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(26, 22, 18, 0.14);
      background: rgba(26, 22, 18, 0.03);
      color: var(--ink);
      font: normal 400 13.5px/1.25 var(--serif);
      cursor: pointer;
      text-align: left;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .biome-option:hover {
      background: rgba(26, 22, 18, 0.08);
    }

    .biome-option[aria-checked="true"] {
      background: rgba(26, 22, 18, 0.88);
      color: #f3ead6;
      border-color: rgba(26, 22, 18, 0.88);
    }

    .biome-option-sub {
      font-style: italic;
      font-size: 11.5px;
      opacity: 0.72;
    }

    #info-panel a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    #info-panel a:hover {
      opacity: 0.7;
    }

    #play-btn .icon-play,
    body[data-paused="true"] #play-btn .icon-pause {
      display: none;
    }

    body[data-paused="true"] #play-btn .icon-play {
      display: block;
    }

    /* Three-slot botanical plate layout: Left, Middle, Right */
    #triptych {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr);
      width: 100vw;
      height: 100dvh;
      max-height: 100vh;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      #triptych {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
      }
      /* Order so Hybrid is in the middle on mobile */
      #slot-left {
        order: 1;
        flex: 1;
        min-height: 0;
      }
      #slot-mid {
        order: 2;
        flex: 1.4;
        min-height: 0;
        background: rgba(0, 0, 0, 0.015);
      }
      #slot-right {
        order: 3;
        flex: 1;
        min-height: 0;
      }
      .slot + .slot::before {
        top: 0;
        bottom: auto;
        left: 20px;
        right: 20px;
        width: auto;
        height: 1px;
      }
      .slot-caption {
        bottom: 6px !important;
        gap: 2px !important;
      }
      .slot-title {
        font-size: 13px !important;
      }
      .slot-sub {
        font-size: 10px !important;
      }
    }

    .slot {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    /* Subtle herbarium plate column hairlines */
    .slot + .slot::before {
      content: "";
      position: absolute;
      top: 56px;
      bottom: 56px;
      left: 0;
      width: 1px;
      background: rgba(0, 0, 0, 0.055);
      pointer-events: none;
      z-index: 3;
    }

    /* The movable stage inside each slot (allows Middle hybrid to glide into Left slot) */
    .slot-stage {
      position: relative;
      width: 100%;
      height: 100%;
      opacity: 0;
      will-change: transform, opacity;
    }

    .slot-stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Hide the default fixed sprig-label created inside sketch.js; we render per-slot labels below */
    .sprig-label {
      display: none !important;
    }

    /* Botanical plate specimen caption at the foot of each slot */
    .slot-caption {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 3;
      pointer-events: none;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .slot-role {
      font: normal 400 10.5px/1 var(--serif);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0.42;
    }

    .slot-title {
      font: italic 300 17px/1.2 var(--serif);
      letter-spacing: 0.02em;
      color: var(--ink);
      opacity: 0.78;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .slot-sub {
      font: italic 300 12.5px/1.25 var(--serif);
      letter-spacing: 0.015em;
      color: var(--ink);
      opacity: 0.52;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
  </style>
</head>
<body data-paused="false">
  <canvas id="paper-backdrop"></canvas>

  <header id="study-header" aria-live="polite">
    <span id="cycle-gen">Generation I</span>
    <span id="cycle-sep">·</span>
    <span id="cycle-phase">Growing Left &amp; Right parents…</span>
    <span id="cycle-timer"></span>
  </header>

  <button id="settings-btn" class="disc" aria-label="Flora Settings" aria-expanded="false" aria-controls="settings-panel" title="Flora biome settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2" />
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
    </svg>
  </button>

  <button id="btn-info" class="disc" aria-label="About Hybridizer" aria-expanded="false" aria-controls="info-panel" title="About &amp; credits">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <line x1="12" y1="10.8" x2="12" y2="16.2" />
      <circle cx="12" cy="7.6" r="0.9" fill="currentColor" stroke="none" />
    </svg>
  </button>

  <button id="play-btn" class="disc" aria-label="Pause" title="Pause / Resume cycle">
    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <rect x="7" y="6" width="3.2" height="12" rx="0.8" />
      <rect x="13.8" y="6" width="3.2" height="12" rx="0.8" />
    </svg>
    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M8.5 6.2v11.6a.8.8 0 0 0 1.2.7l9.3-5.8a.8.8 0 0 0 0-1.4L9.7 5.5a.8.8 0 0 0-1.2.7z" />
    </svg>
  </button>

  <button id="next-btn" class="disc" aria-label="Advance phase" title="Skip to next phase">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none" />
      <line x1="19" y1="5" x2="19" y2="19" />
    </svg>
  </button>

  <aside id="settings-panel" role="dialog" aria-label="Flora Biome Settings" hidden>
    <h2>Flora Biome</h2>
    <p>Choose a 44-species botanical pool for hybridization:</p>
    <div class="biome-toggle-group" role="radiogroup" aria-label="Flora Biome">
      <button type="button" class="biome-option" role="radio" data-biome="original" aria-checked="true">
        <span>Original (European)</span>
        <span class="biome-option-sub">44 trees &amp; shrubs</span>
      </button>
      <button type="button" class="biome-option" role="radio" data-biome="tropical" aria-checked="false">
        <span>Tropical</span>
        <span class="biome-option-sub">44 exotic flowers</span>
      </button>
      <button type="button" class="biome-option" role="radio" data-biome="alien" aria-checked="false">
        <span>Alien</span>
        <span class="biome-option-sub">44 xenobotanicals</span>
      </button>
    </div>
  </aside>

  <aside id="info-panel" role="dialog" aria-label="About Hybridizer" hidden>
    <h2>Hybridizer</h2>
    <p>Continuous botanical cross-breeding study built on <strong>Jack Bush</strong>’s procedural <a href="https://jackbush.github.io/glimmers/sprig/" target="_blank" rel="noopener noreferrer"><em>Sprig</em></a>.</p>
  </aside>

  <main id="triptych">
    <section id="slot-left" class="slot" data-slot="left" data-active="false">
      <div class="slot-stage">
        <canvas id="canvas-left"></canvas>
        <div class="slot-caption">
          <div class="slot-role">Parent A · Left</div>
          <div class="slot-title"></div>
          <div class="slot-sub"></div>
        </div>
      </div>
    </section>

    <section id="slot-mid" class="slot" data-slot="middle" data-active="false">
      <div class="slot-stage">
        <canvas id="canvas-mid"></canvas>
        <div class="slot-caption">
          <div class="slot-role">Hybrid · Middle</div>
          <div class="slot-title"></div>
          <div class="slot-sub"></div>
        </div>
      </div>
    </section>

    <section id="slot-right" class="slot" data-slot="right" data-active="false">
      <div class="slot-stage">
        <canvas id="canvas-right"></canvas>
        <div class="slot-caption">
          <div class="slot-role">Parent B · Right</div>
          <div class="slot-title"></div>
          <div class="slot-sub"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
